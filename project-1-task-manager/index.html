<!DOCTYPE html>
<html lang="en">
    <head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="A simple task manager to keep track of your daily tasks">
		<title>Task Manager</title>
		<link rel="stylesheet" href="style.css">
    </head>

	<body>

		<!-- ========== HEADER ========== -->
		 <header class="app-header">
			<div class="header-content">
				<h1 class="app-title">Task Manager</h1>
				<p class="app-subtitle">Stay organised.Get things done.</p>
			</div>
		 </header>

		 <!-- ========== MAIN CONTENT ========== -->
		 <main class="app-main">

			<!-- ADD TASK FROM -->
			<section class="form-section" arial-label="Add a new task">
				<form class="task-form" id="task-form">
					<div class="form-group">
						<label for="task-input" class="form-label">New Task</label>
						<div class="input-row">
							<input
								type="text"
								id="task-input"
								class="task-input"
								placeholder="What needs to be done?"
								maxlength="200"
								autocomplete="off"
								aria-required="true"
							>
							<button type="submit" class="btn-primary" id="add-task-btn">
								Add Task
							</button>
						</div>
						<p class="input-error" id="input-error" role="alert" aria-live="polite"></p>
					</div>
				</form>
			</section>

			<!-- TASK STATISTICS -->
			 <section class="stats-section" aria-label="Task statistics">
				<div class="stats-container">
					<div class="stat-card">
						<span class="stat-number" id="total-count">0</span>
						<span class="stat-label">Total</span>
					</div>
					<div class="stat-card">
						<span class="stat-number" id="active-count">0</span>
						<span class="stat-label">Active</span>
					</div>
					<div class="stat-card">
						<span class="stat-number" id="completed-count">0</span>
						<span class="stat-label">Completed</span>
					</div>
				</div>
			 </section>

			 <!-- FILTER BUTTONS -->
			  <section class="filter-section" aria-label="Filter tasks">
				<div class="filter-container">
					<button 
					class="btn btn-filter btn-filter-active"
					id="filter-all"
					data-filter="all"
					aria-pressed="true"
				    >
					All
			        </button>
					<button
					class="btn btn-filter"
					id="filter-active"
					data-filter="active"
					aria-pressed="false"
					>
					Active
					</button>
					<button
					class="btn btn-filter"
					id="filter-completed"
					data-filter="completed"
					aria-pressed="false"
					>
					Completed
					</button>
				</div>
			  </section>

			  <!-- TASK LIST -->
			   <section class="task-list-section" aria-label="Task list">

				<!-- Empty state - shown when no task exist -->
				 <div class="empty-state" id="empty-state">
					<p class="empty-state-text">No tasks yet.</p>
					<p class="smpty-state-subtext">Add your first task above to get started.</p>
				 </div>

				 <!-- The actual list - populated by JavaScript -->
				 <ul class="task-list" id="task-list" role="list" aria-label="List of tasks">
					<!-- Task items will be inserted here by JavaScript -->
					 <!-- Example of what a task item will look like:
					<li class="task-item" data-id="1" data-completed="false">
						<div class="task-content">
							<button class="task-completed-btn" aria-label="Mark task as complete">
								<span class="checkmark-icon" aria-hidden="true"></span>
							</button>
							<span class="task-text">Buy groceries</span>
						</div>
						<div class="task-actions">
							<button class="btn btn-edit" aria-label="Edit task">Edit</button>
							<button class="btn btn-delete" aria-label="Delete task">Delete</button>
						</div>
					</li>
				 	-->
				 </ul>

			   </section>

			   <!-- CLEAR COMPLETED BUTTON -->
				<section class="action-section" aria-label="Bulk actions">
					<button class="btn btn-danger" id="clear-completed-btn">
						Clear Completed
					</button>
				</section>
		 </main>

		 <!-- ========== FOOTER ========== -->
		 <footer class="app-footer">
			<p class="footer-text">Task Manager &copy; 2025. Build with the MERN Stack Course.</p>
		 </footer>

		 <!-- JavaScript file - loaded at the bottom of body, explained below -->
		  <script src="app.js"></script>
	</body>
</html>
